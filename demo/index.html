<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Рисование и заливка — демо (floodfill.js / CanvasFloodFiller)</title>
    <script src="../floodfill.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        /*
         * Демо — колонка на всю высоту окна: холст занимает всё свободное место,
         * а под ним — кнопки и палитра. Всё вмещается в экран без прокрутки.
         */
        #ff-demo {
            --ff-accent: #2563eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 100%;
            box-sizing: border-box;
            height: 100vh;
            height: 100dvh; /* на мобильных адресная панель динамическая; без поддержки dvh останется 100vh */
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }
        #ff-demo *,
        #ff-demo *::before,
        #ff-demo *::after {
            box-sizing: border-box;
        }

        /* Холст: растягивается на всё свободное место между подсказкой и кнопками.
           flex: 1 1 auto + min-height: 0 позволяют ему сжиматься, чтобы не выталкивать
           кнопки и палитру за нижний край окна. Размеры холста в пикселях задаёт скрипт. */
        #ff-canvas-wrap {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            border: 1px solid #c9c9c9;
            border-radius: 6px;
            background-color: #ffffff;
            /* Светлая "клеточка", чтобы прозрачный холст был виден до первого штриха */
            background-image:
                    linear-gradient(45deg, #ececec 25%, transparent 25%, transparent 75%, #ececec 75%),
                    linear-gradient(45deg, #ececec 25%, transparent 25%, transparent 75%, #ececec 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        #ff-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 12px;
            flex: none;
        }
        /* Регулятор допуска заливки: 0 — только точное совпадение цвета,
           больше — заливаются и соседние похожие оттенки */
        #ff-tolerance {
            display: flex;
            align-items: center;
            gap: 8px;
            font: inherit;
            font-size: 15px;
            line-height: 1.2;
            padding: 8px 12px;
            border: 1px solid #c9c9c9;
            border-radius: 6px;
            background: #ffffff;
            color: #1a1a1a;
            flex: none;
        }
        #ff-tolerance input[type="range"] {
            width: 120px;
            margin: 0;
            accent-color: var(--ff-accent);
        }
        #ff-tolerance output {
            min-width: 2.5ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        #ff-demo .ff-btn {
            font: inherit;
            font-size: 15px;
            line-height: 1.2;
            padding: 8px 16px;
            border: 1px solid #c9c9c9;
            border-radius: 6px;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }
        #ff-demo .ff-btn:hover {
            border-color: var(--ff-accent);
        }
        #ff-demo .ff-btn-active {
            background: var(--ff-accent);
            border-color: var(--ff-accent);
            color: #ffffff;
        }

        #ff-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: none;
        }
        #ff-demo .ff-swatch {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .25);
            transition: transform .1s ease, box-shadow .15s ease;
        }
        #ff-demo .ff-swatch:hover {
            transform: scale(1.12);
        }
        #ff-demo .ff-swatch-active {
            box-shadow: 0 0 0 2px var(--ff-accent);
            transform: scale(1.12);
        }
    </style>
</head>
<body>

<!-- ============ Демо-блок: можно вставлять в пост WordPress ============ -->
<div id="ff-demo">
    <div id="ff-canvas-wrap"></div>
    <div id="ff-toolbar">
        <button type="button" id="ff-tool-draw" class="ff-btn">Рисунок</button>
        <button type="button" id="ff-tool-fill" class="ff-btn">Заливка</button>
        <label id="ff-tolerance" class="ff-tolerance" title="Допуск на цветовое расстояние при заливке: 0 — заливается только точно совпадающий цвет">
            <span>Допуск</span>
            <input type="range" id="ff-tolerance-range" min="0" max="255" step="1" value="32">
            <output id="ff-tolerance-value" for="ff-tolerance-range">32</output>
        </label>
    </div>
    <div id="ff-palette"></div>
</div>
<!-- ============ Конец демо-блока ============ -->

<script>

    /* TrainPainter.js — урезанная копия: только карандаш (PENCIL) и заливка (FILL) */

    class TrainCanvas {
        // private:
        _mainImage = null;      // HTMLCanvas: главное изображение
        _editGlass = null;      // DOMElement: "стекло" для событий мыши/тача

        _last = {x: -1, y: -1};         // "Прошлые" координаты при рисовании
        _mouseDown = {x: -1, y: -1};    // Координаты нажатия кнопки
        _mousePressed = false;          // Кнопка/палец нажаты?

        // 2D-контекст основной канвы
        _canvasContext = null;

        // Цвета: передний план (карандаш) и задний (заливка)
        _foreground = {r: 0, g: 0, b: 0, a: 255};
        _background = {r: 0, g: 0, b: 0, a: 255};

        // Допуск на цветовое расстояние для заливки
        _tolerance = 32;

        // Пустышка для неиспользуемых слотов таблиц инструментов (слот 0 = NONE)
        noop = () => { };

        // public:
        tools = {
            NONE: 0,
            PENCIL: 2,      // Карандаш
            FILL: 11        // Заливка
        };

        _currentTool = this.tools.NONE;

        // Включение инструмента (правит курсор над "стеклом")
        _toolSwitchedOn = {
            0: this.noop,
            2: () => { this._editGlass.style.cursor = "crosshair"; },
            11: () => { this._editGlass.style.cursor = "default"; }
        };

        // Выключение инструмента (карандашу и заливке нечего чинить)
        _toolSwitchedOff = {
            0: this.noop,
            2: this.noop,
            11: this.noop
        };

        // Действие по нажатию кнопки/пальца
        _toolMouseDown = {
            0: this.noop,
            2: (evt) => {
                // Карандаш: сразу рисуем точку
                this._canvasContext.beginPath();
                this._canvasContext.moveTo(evt.localX, evt.localY);
                this._canvasContext.lineTo(evt.localX, evt.localY);
                this._canvasContext.stroke();
            },
            11: (evt) => {
                // Заливка: срабатывает по клику. Допуск — необязательный
                // параметр конструктора; его же можно поменять позже как
                // свойство: cff.tolerance = n
                const cff = new CanvasFloodFiller(this._tolerance);
                cff.floodFill(this._canvasContext, evt.localX, evt.localY, this._background);
            }
        };

        // Действие по отпусканию кнопки/пальца
        _toolMouseUp = {
            0: this.noop,
            2: () => {
                // Карандаш: завершаем штрих
                this._canvasContext.stroke();
            },
            11: this.noop
        };

        // Действие при движении мыши/пальца
        _toolMouseMove = {
            0: this.noop,
            2: (evt) => {
                // Карандаш: ведём линию за курсором
                if (this._mousePressed) {
                    this._canvasContext.beginPath();
                    this._canvasContext.moveTo(this._last.x, this._last.y);
                    this._canvasContext.lineTo(evt.localX, evt.localY);
                    this._canvasContext.stroke();
                }
            },
            11: this.noop
        };

        /*
         * bool create(DOMElement pElement, int w, int h)
         * Создаёт рисовалку внутри указанного DOM-элемента.
         * */
        create(pElement, w, h) {
            // Канва и "стекло" событий. Overlay-канва не нужна: её использовали
            // только инструменты с предпросмотром (линия, фигуры), которых здесь нет.
            this._mainImage = document.createElement("canvas");
            this._editGlass = document.createElement("div");

            this._mainImage.style.width = this._editGlass.style.width = w + "px";
            this._mainImage.style.height = this._editGlass.style.height = h + "px";

            this._mainImage.width = w;
            this._mainImage.height = h;

            // Абсолютное позиционирование внутри контейнера
            this._mainImage.style.position = this._editGlass.style.position = "absolute";

            // Отключаем на "стекле" жесты браузера (прокрутку и масштабирование
            // двойным тапом), чтобы касания целиком уходили в рисование
            this._editGlass.style.touchAction = 'none';

            pElement.appendChild(this._mainImage);
            pElement.appendChild(this._editGlass);

            this._canvasContext = this._mainImage.getContext("2d");

            this._canvasContext.fillStyle = "rgba(0, 0, 255, 1.0)";
            this._canvasContext.strokeStyle = "rgba(255, 0, 0, 1.0)";
            this._canvasContext.lineWidth = 2;

            /*
             * void digestEvent(Event myEvent, bool doNotStop)
             * Переводит координаты события в локальные координаты канвы.
             * Округление до целых пикселей защищает заливку от бесконечного
             * цикла при дробных координатах на тач-устройствах.
             **/
            const digestEvent = (myEvent, doNotStop) => {
                if (doNotStop == null || doNotStop == false) {
                    myEvent.preventDefault();
                    myEvent.stopPropagation();
                }

                let px = 0;
                let py = 0;

                if (myEvent.changedTouches && myEvent.changedTouches.length > 0) {
                    // На touchend массив touches уже пуст, поэтому первым берём changedTouches
                    px = myEvent.changedTouches[0].pageX;
                    py = myEvent.changedTouches[0].pageY;
                } else if (myEvent.touches && myEvent.touches.length > 0) {
                    px = myEvent.touches[0].pageX;
                    py = myEvent.touches[0].pageY;
                } else {
                    px = myEvent.pageX;
                    py = myEvent.pageY;
                }

                const canvX = this._editGlass._calcX;
                const canvY = this._editGlass._calcY;

                myEvent.localX = Math.floor(px - canvX);
                myEvent.localY = Math.floor(py - canvY);
            }

            // Нажатие кнопки (или касание)
            const mousedown = (evt) => {
                digestEvent(evt);

                if (this._currentTool >= 0) {
                    this._toolMouseDown[this._currentTool](evt);
                }

                this._mouseDown.x = evt.localX;
                this._mouseDown.y = evt.localY;

                // Начальная точка штриха: иначе карандаш на первом движении
                // дотянул бы линию из конца предыдущего штриха
                this._last.x = evt.localX;
                this._last.y = evt.localY;

                this._mousePressed = true;
            };

            // Перемещение мыши
            const mousemove = (evt) => {
                // Полностью перевариваем событие, только пока рисуем;
                // иначе оставляем странице прокрутку
                digestEvent(evt, (this._mousePressed == false));

                if (this._currentTool >= 0) {
                    this._toolMouseMove[this._currentTool](evt);
                }

                this._last.x = evt.localX;
                this._last.y = evt.localY;
            };

            // Отпускание кнопки
            const mouseup = (evt) => {
                // _mousePressed != false нужна потому, что mouseup ловим по документу
                if (this._currentTool >= 0 && this._mousePressed != false) {
                    digestEvent(evt);
                    this._toolMouseUp[this._currentTool](evt);
                }

                this._mouseDown.x = this._mouseDown.y = -1;
                this._mousePressed = false;
            }

            // Касание экрана пальцем. Работает как mousedown.
            const touchstart = (evt) => {
                // Игнорируем мультитач: рисуем только первым пальцем
                if (evt.touches.length > 1) {
                    return;
                }

                digestEvent(evt);

                if (this._currentTool >= 0) {
                    this._toolMouseDown[this._currentTool](evt);
                }

                this._mouseDown.x = evt.localX;
                this._mouseDown.y = evt.localY;

                this._last.x = evt.localX;
                this._last.y = evt.localY;

                this._mousePressed = true;
            };

            // Движение пальца. Работает как mousemove.
            const touchmove = (evt) => {
                digestEvent(evt, (this._mousePressed == false));

                if (this._currentTool >= 0) {
                    this._toolMouseMove[this._currentTool](evt);
                }

                this._last.x = evt.localX;
                this._last.y = evt.localY;
            };

            // Палец ушёл с экрана. Работает как mouseup.
            const touchend = (evt) => {
                if (this._currentTool >= 0 && this._mousePressed != false) {
                    digestEvent(evt);
                    this._toolMouseUp[this._currentTool](evt);
                }

                this._mouseDown.x = this._mouseDown.y = -1;
                this._mousePressed = false;
            }

            // Жест прерван системой — завершаем штрих как при обычном отрыве пальца
            const touchcancel = touchend;

            // Пересчёт позиции канвы на странице (для перевода координат событий)
            const recalcPosition = () => {
                this._editGlass._calcX = this._editGlass.offsetLeft;
                this._editGlass._calcY = this._editGlass.offsetTop;

                let obj = this._editGlass.offsetParent;
                while (obj != null) {
                    this._editGlass._calcX += obj.offsetLeft;
                    this._editGlass._calcY += obj.offsetTop;
                    obj = obj.offsetParent;
                }
            }

            recalcPosition();   // Изначальный вызов

            // Современная событийная модель. Тач-события — непассивные, иначе
            // preventDefault в digestEvent не сможет отменять прокрутку.
            // Движение и отрыв продублированы на окно: рисование не обрывается,
            // когда мышь/палец выходит за границы канвы.
            this._editGlass.addEventListener('mousedown', mousedown);
            this._editGlass.addEventListener('touchstart', touchstart, {passive: false});
            window.addEventListener('mousemove', mousemove);
            window.addEventListener('touchmove', touchmove, {passive: false});
            window.addEventListener('mouseup', mouseup);
            window.addEventListener('touchend', touchend);
            window.addEventListener('touchcancel', touchcancel);
            window.addEventListener('resize', recalcPosition);
            window.addEventListener('scroll', recalcPosition);

            return true;
        }

        /*
         * void selectTool(int tool, Object parameters)
         * Выбирает текущий инструмент (PENCIL или FILL).
         * */
        selectTool(tool, parameters) {
            // Проверка диапазона
            if (tool < 0 || tool > 11)
                return;

            // Инструмент на лету не меняется
            this._mousePressed = false;

            if (this._currentTool >= 0)
                this._toolSwitchedOff[this._currentTool]();

            this._toolSwitchedOn[tool](parameters);

            this._currentTool = tool;
        }

        /*
         * void setTolerance(int tolerance)
         * Задать допуск на цветовое расстояние для заливки.
         * */
        setTolerance(tolerance) {
            this._tolerance = tolerance;
        }

        /*
         * void setForegroundColor(int r, int g, int b, float a)
         * Установить цвет карандаша (RGBA).
         * */
        setForegroundColor(r, g, b, a) {
            this._foreground.r = r;
            this._foreground.g = g;
            this._foreground.b = b;
            this._foreground.a = a;

            this._canvasContext.strokeStyle = "rgba(" + r + "," + g + "," + b + "," + a + ")";
        }

        /*
         * void setBackgroundColor(int r, int g, int b, float a)
         * Установить цвет заливки (RGBA).
         * */
        setBackgroundColor(r, g, b, a) {
            this._background.r = r;
            this._background.g = g;
            this._background.b = b;
            this._background.a = a;

            this._canvasContext.fillStyle = "rgba(" + r + "," + g + "," + b + "," + a + ")";
        }
    }


    /* ============================================================
     * Клей для демки: размеры, инструменты, палитра
     * ============================================================ */
    (() => {
        'use strict';

        const wrap = document.getElementById('ff-canvas-wrap');
        if (!wrap) {
            return;
        }

        const btnDraw = document.getElementById('ff-tool-draw');
        const btnFill = document.getElementById('ff-tool-fill');
        const paletteEl = document.getElementById('ff-palette');

        // Текущее состояние демки
        let currentTool = 2; // TrainCanvas.tools.PENCIL
        let currentColor = {r: 0, g: 0, b: 0, a: 255};
        let currentTolerance = 32; // допуск заливки (по умолчанию, как в библиотеке)
        let canv = null;
        let currentW = 0;
        let currentH = 0;

        /* ---------- размеры и создание холста ---------- */

        const canvasSize = () => {
            let w = wrap.clientWidth;
            let h = wrap.clientHeight;
            if (w === 0) {
                w = wrap.parentNode ? wrap.parentNode.clientWidth : 640;
            }
            if (h === 0) {
                // Высота ещё не посчитана (например, при первой вставке в пост) —
                // временно берём её из ширины
                h = Math.round(w * 0.55);
            }
            if (w < 100) {
                w = 100;
            }
            if (h < 80) {
                h = 80;
            }
            return {w: w, h: h};
        }

        const createCanvas = () => {
            wrap.innerHTML = '';
            const size = canvasSize();
            currentW = size.w;
            currentH = size.h;
            canv = new TrainCanvas();
            canv.create(wrap, size.w, size.h);
            wrap.style.height = size.h + 'px';
            applyColor();
            canv.selectTool(currentTool, null);
            canv.setTolerance(currentTolerance);
        }

        const applyColor = () => {
            canv.setForegroundColor(currentColor.r, currentColor.g, currentColor.b, currentColor.a);
            canv.setBackgroundColor(currentColor.r, currentColor.g, currentColor.b, currentColor.a);
        }

        /*
         * Динамический ресайз: холст пересоздаётся под текущий размер
         * контейнера (меняется вместе с окном). Чтобы не терять рисунок,
         * перед пересозданием кадр сохраняется (toDataURL) и после —
         * растягивается на новый холст.
         */
        let savedFrame = null;
        let resizeTimer = null;

        const onResize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const size = canvasSize();
                // Размеры холста задаёт flex-раскладка, поэтому следим за обеими осями
                if (Math.abs(size.w - currentW) < 2 && Math.abs(size.h - currentH) < 2) {
                    return; // размеры не изменились — ничего не делаем
                }
                const main = wrap.children[0];
                if (main && main.toDataURL) {
                    try {
                        savedFrame = main.toDataURL();
                    } catch (e) {
                        savedFrame = null;
                    }
                }
                createCanvas();
                if (savedFrame) {
                    const img = new Image();
                    img.onload = () => {
                        const ctx = wrap.children[0].getContext('2d');
                        const s2 = canvasSize();
                        ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, s2.w, s2.h);
                    };
                    img.src = savedFrame;
                }
            }, 200);
        }
        window.addEventListener('resize', onResize);

        // Дополнительно следим за шириной контейнера: тема WP может
        // перестроить блок без изменения размера окна. Защита от цикла —
        // в onResize: пересоздание меняет только высоту контейнера.
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => {
                onResize();
            }).observe(wrap);
        }

        /* ---------- инструменты ---------- */

        const activateTool = (btn) => {
            const btns = document.querySelectorAll('#ff-demo .ff-btn');
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove('ff-btn-active');
            }
            btn.classList.add('ff-btn-active');
        }

        btnDraw.addEventListener('click', () => {
            currentTool = canv.tools.PENCIL;
            canv.selectTool(currentTool, null);
            activateTool(btnDraw);
        });

        btnFill.addEventListener('click', () => {
            currentTool = canv.tools.FILL;
            canv.selectTool(currentTool, null);
            activateTool(btnFill);
        });

        /* ---------- допуск заливки ---------- */

        const toleranceRange = document.getElementById('ff-tolerance-range');
        const toleranceValue = document.getElementById('ff-tolerance-value');

        toleranceRange.addEventListener('input', () => {
            currentTolerance = parseInt(toleranceRange.value, 10);
            toleranceValue.textContent = String(currentTolerance);
            if (canv) {
                canv.setTolerance(currentTolerance);
            }
        });

        /* ---------- палитра ---------- */

        const palette = [
            ['#000000', 'Чёрный'],
            ['#ffffff', 'Белый'],
            ['#808080', 'Серый'],
            ['#b71c1c', 'Красный'],
            ['#ff7f00', 'Оранжевый'],
            ['#fdd835', 'Жёлтый'],
            ['#388e3c', 'Зелёный'],
            ['#0097a7', 'Бирюзовый'],
            ['#1565c0', 'Синий'],
            ['#6a1b9a', 'Фиолетовый'],
            ['#ec407a', 'Розовый'],
            ['#795548', 'Коричневый']
        ];

        const hexToRgba = (hex) => {
            const n = parseInt(hex.slice(1), 16);
            return {r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255, a: 255};
        }

        palette.forEach((item) => {
            const swatch = document.createElement('span');
            swatch.className = 'ff-swatch';
            swatch.title = item[1];
            swatch.style.background = item[0];

            swatch.addEventListener('click', () => {
                // Выбор цвета из палитры ставит оба цвета сразу —
                // и "перо" (обводка), и заливку
                currentColor = hexToRgba(item[0]);
                applyColor();

                const sw = paletteEl.getElementsByClassName('ff-swatch');
                for (let i = 0; i < sw.length; i++) {
                    sw[i].classList.remove('ff-swatch-active');
                }
                swatch.classList.add('ff-swatch-active');
            });

            paletteEl.appendChild(swatch);
        });

        /* ---------- старт ---------- */

        createCanvas();
        activateTool(btnDraw);
        paletteEl.children[0].classList.add('ff-swatch-active');
    })();
</script>

</body>
</html>
